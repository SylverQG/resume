name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        # Pages 以 https://<用户名>.github.io/<仓库名>/ 子路径发布，base 自动取仓库名
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # 前提（仅首次需要手动）：仓库 Settings → Pages → Source 选「GitHub Actions」
      # GITHUB_TOKEN 无权创建 Pages 站点，无法由工作流代劳
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
